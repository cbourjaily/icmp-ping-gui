[project]
name = "icmp-ping-gui"
version = "0.1.0"
description = "A cross-platform ICMP ping utility with a desktop GUI, built with Python and Flet."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Christopher Vote", email = "cbourjaily@gmail.com" }
]
dependencies = [
    "flet>=0.86.4"
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.4",
    "flet-desktop>=0.86.4",
    "flet-web>=0.86.4",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=0.86.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
desktop_flavor = "light"    # Change to "full" to use flet-audio and flet-video
org = "com.mycompany"
product = "icmp-ping-gui"
company = "Flet"
copyright = "Copyright (C) 2026 by Christopher Vote"

[tool.flet.app]
path = "src"
module = "ping_gui"
name = "icmp-ping-gui"
include = [
	"icmp_ping_backend.py"
]
